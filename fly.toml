app = "espanol-mastery"
primary_region = "ord"

[build]
builder = "heroku"
buildpacks = ["heroku/nodejs-engine", "heroku/nodejs-npm-build-script"]

[env]
NODE_ENV = "production"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true

[checks]
http_checks = [
  {
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/health"
    protocol = "https"
    timeout = "5s"
    type = "http"
  }
]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024